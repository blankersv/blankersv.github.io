<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Fleece Navidad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Berkshire+Swash&family=Libre+Baskerville:wght@400;700&display=swap">
<style>
  :root {
    --navy: #14213D;
    --cream: #F4EFE6;
    --muted: #B8C2D6;
    --accent: #E0475B;
    --gold: #C9A55A;
    --error: #B42318;
    --field-border: #C9D1E0;
    --serif: 'Libre Baskerville', Georgia, 'Times New Roman', serif;
    --display: 'Berkshire Swash', 'Libre Baskerville', Georgia, serif;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { background: var(--navy); }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--navy);
    color: var(--cream);
    font-family: var(--serif);
    isolation: isolate;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  [hidden] { display: none !important; }

  /* Snow: old-school asterisks drifting behind everything */
  .snow { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
  .flake {
    position: absolute; top: -5%;
    color: #FFFFFF; font-family: 'Courier New', Courier, monospace; font-weight: 700; line-height: 1;
    animation-name: fleece-snow; animation-timing-function: steps(60); animation-iteration-count: infinite;
  }
  @keyframes fleece-snow { from { top: -5%; } to { top: 102%; } }

  .screen {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex; flex-direction: column; align-items: center;
    padding: 64px 24px;
    gap: 40px;
  }

  /* Sign in */
  .masthead { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
  .banner {
    display: block; width: 200px; max-width: 60vw; height: auto;
    border-radius: 2px; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
  }
  h1.title {
    margin: 0; font-family: var(--display); font-weight: 400;
    font-size: clamp(48px, 13vw, 72px); line-height: 1; color: var(--accent);
  }
  .card {
    width: 100%; max-width: 440px;
    background: #FFFFFF; color: var(--navy);
    border-radius: 6px; padding: 32px;
    display: flex; flex-direction: column; gap: 20px;
  }
  .field { display: flex; flex-direction: column; gap: 8px; }
  select, input {
    width: 100%; height: 48px; padding: 0 14px;
    border: 2px solid var(--field-border); border-radius: 4px;
    background: #FFFFFF; color: var(--navy);
    font-family: var(--serif); font-size: 16px;
  }
  input::placeholder { color: #5E6B82; }
  select:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  input[aria-invalid="true"] { border-color: var(--error); }
  .error {
    margin: 0; display: flex; align-items: flex-start; gap: 8px;
    font-size: 14px; line-height: 1.5; color: var(--error);
  }
  .error svg { flex: none; margin-top: 1px; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    height: 52px; padding: 0 32px;
    border: none; border-radius: 6px;
    background: var(--accent); color: #FFFFFF;
    font-family: var(--serif); font-weight: 700; font-size: 20px;
    cursor: pointer;
  }
  .btn:focus-visible { outline: 3px solid var(--cream); outline-offset: 3px; }
  .btn:disabled { opacity: 0.7; cursor: progress; }
  .card .btn { width: 100%; }

  /* Letter screen */
  .letter-screen { padding-top: 40px; gap: 32px; }
  .topbar { width: 100%; max-width: 960px; }
  .wordmark { margin: 0; font-family: var(--display); font-size: 32px; color: var(--accent); }
  .letter-screen .btn { height: 56px; padding: 0 40px; font-size: 22px; }

  .envelope { position: relative; width: 460px; max-width: 100%; height: 520px; margin-top: 16px; }
  .env-back {
    position: absolute; left: 0; top: 220px; width: 100%; height: 300px;
    background: #DDCFB3; border-radius: 4px;
    box-shadow: 0 18px 36px rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(0, 0, 0, 0.06);
  }
  .tri { position: absolute; left: 0; width: 100%; }
  .flap-open { position: absolute; inset: 0; transform-origin: 50% 220px; }
  .flap-open .gold { top: 40px; height: 180px; background: var(--gold); clip-path: polygon(50% 0, 100% 100%, 0 100%); }
  .flap-open .paper { top: 44px; height: 176px; background: #EBE1CC; clip-path: polygon(50% 0, 100% 100%, 0 100%); }

  .letter-clip { position: absolute; left: 0; top: 0; width: 100%; height: 520px; overflow: hidden; }
  .letter {
    position: absolute; left: 36px; right: 36px; top: 96px; height: 320px;
    background: #FBF7EE; border-radius: 2px; box-shadow: 0 6px 16px rgba(0, 0, 0, 0.3);
    padding: 32px 24px;
    display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center;
    color: var(--navy);
  }
  .letter-label { margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #5C4E3A; }
  .letter-name {
    margin: 0; font-family: var(--display); font-weight: 400;
    font-size: clamp(40px, 12vw, 64px); line-height: 1.05; color: var(--accent);
    overflow-wrap: anywhere;
  }
  .letter-rule { width: 64px; height: 2px; background: var(--gold); margin-top: 6px; }

  .env-front { position: absolute; left: 0; top: 220px; width: 100%; height: 300px; overflow: hidden; border-radius: 4px; }
  .env-front .tri { top: 0; height: 100%; }
  .side-l { background: #E8DDC6; clip-path: polygon(0 0, 50% 56%, 0 100%); }
  .side-r { background: #E8DDC6; clip-path: polygon(100% 0, 50% 56%, 100% 100%); }
  .bottom { background: #E1D3B8; clip-path: polygon(0 100%, 50% 52%, 100% 100%); }

  .flap-closed {
    position: absolute; left: 0; top: 220px; width: 100%; height: 300px;
    filter: drop-shadow(0 4px 4px rgba(0, 0, 0, 0.28));
    transform-origin: 50% 0;
  }
  .flap-closed .gold { top: 0; height: 180px; background: var(--gold); clip-path: polygon(0 0, 100% 0, 50% 100%); }
  .flap-closed .paper { top: 0; height: 176px; background: #F4EDDF; clip-path: polygon(0 0, 100% 0, 50% 100%); }

  .seal {
    position: absolute; left: calc(50% - 52px); top: 346px; width: 104px; height: 104px;
    border-radius: 50%; background: var(--accent);
    box-shadow: inset 0 -6px 10px rgba(0, 0, 0, 0.35), inset 0 4px 8px rgba(255, 255, 255, 0.25), 0 4px 8px rgba(0, 0, 0, 0.4);
    display: flex; align-items: center; justify-content: center;
  }
  .seal-ring {
    width: 78px; height: 78px; border-radius: 50%;
    border: 2px solid rgba(0, 0, 0, 0.25);
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .seal-ring img { display: block; width: 70px; height: 70px; border-radius: 50%; object-fit: cover; mix-blend-mode: multiply; opacity: 0.75; }

  /* Opening and closing. Closed-state transitions run when concealing. */
  .seal { transition: opacity 0.3s ease 0.95s, transform 0.3s ease 0.95s; }
  .flap-closed { transition: transform 0.3s ease-out 0.7s; }
  .flap-open { transform: scaleY(0); transition: transform 0.3s ease-in 0.4s; }
  .letter { transform: translateY(190px); transition: transform 0.45s ease-in 0s; }

  .envelope.is-open .seal { opacity: 0; transform: scale(1.15); pointer-events: none; transition: opacity 0.35s ease, transform 0.35s ease; }
  .envelope.is-open .flap-closed { transform: scaleY(0); transition: transform 0.3s ease-in 0.25s; }
  .envelope.is-open .flap-open { transform: none; transition: transform 0.3s ease-out 0.55s; }
  .envelope.is-open .letter { transform: none; transition: transform 0.6s cubic-bezier(0.2, 0.7, 0.2, 1) 0.85s; }

  @media (prefers-reduced-motion: reduce) {
    .flake { display: none; }
    .seal, .flap-closed, .flap-open, .letter,
    .envelope.is-open .seal, .envelope.is-open .flap-closed,
    .envelope.is-open .flap-open, .envelope.is-open .letter { transition: none; }
  }
  @media (max-width: 480px) {
    .screen { padding: 40px 16px; gap: 28px; }
    .card { padding: 24px; }
  }
</style>
</head>
<body>
<div class="snow" id="snow" aria-hidden="true"></div>

<main>
  <section class="screen" id="signin-screen" aria-labelledby="title">
    <div class="masthead">
      <img class="banner" src="images/banner.jpg" alt="Embroidered banner of a haloed lamb with a shepherd’s crook" width="332" height="348">
      <h1 class="title" id="title">Fleece Navidad</h1>
    </div>
    <form class="card" id="signin-form" novalidate>
      <div class="field">
        <label class="sr-only" for="who">Your name</label>
        <select id="who" name="who" required>
          <option value="">Pick your name</option>
        </select>
      </div>
      <div class="field">
        <label class="sr-only" for="code">Secret passcode</label>
        <input id="code" name="code" type="password" placeholder="Secret passcode" autocomplete="off" autocapitalize="none" spellcheck="false" aria-describedby="form-error">
        <p class="error" id="form-error" role="alert" hidden>
          <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><circle cx="10" cy="10" r="8.5" fill="none" stroke="currentColor" stroke-width="1.6"></circle><path d="M10 5.5v5.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path><circle cx="10" cy="14.2" r="1.1" fill="currentColor"></circle></svg>
          <span id="form-error-text"></span>
        </p>
      </div>
      <button class="btn" type="submit" id="submit">Submit to the Flock</button>
    </form>
  </section>

  <section class="screen letter-screen" id="letter-screen" aria-label="Your letter" hidden>
    <div class="topbar"><p class="wordmark">Fleece Navidad</p></div>
    <div class="envelope" id="envelope">
      <div class="env-back"></div>
      <div class="flap-open" aria-hidden="true"><div class="tri gold"></div><div class="tri paper"></div></div>
      <div class="letter-clip">
        <div class="letter" id="letter" aria-live="polite">
          <p class="letter-label">Your sheep is</p>
          <p class="letter-name" id="letter-name"></p>
          <div class="letter-rule" aria-hidden="true"></div>
        </div>
      </div>
      <div class="env-front" aria-hidden="true"><div class="tri side-l"></div><div class="tri side-r"></div><div class="tri bottom"></div></div>
      <div class="flap-closed" aria-hidden="true"><div class="tri gold"></div><div class="tri paper"></div></div>
      <div class="seal" aria-hidden="true"><div class="seal-ring"><img src="images/lamb.jpg" alt=""></div></div>
    </div>
    <button class="btn" type="button" id="toggle" aria-controls="letter" aria-expanded="false">Reveal your sheep</button>
  </section>
</main>

<script src="data.js"></script>
<script>
(function () {
  'use strict';

  // ---- Snow ----
  var snow = document.getElementById('snow');
  var seed = 7;
  function rand() { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
  for (var i = 0; i < 45; i++) {
    var f = document.createElement('span');
    f.className = 'flake';
    f.textContent = '*';
    f.style.left = (rand() * 100).toFixed(1) + '%';
    f.style.fontSize = Math.round(10 + rand() * 16) + 'px';
    f.style.opacity = (0.5 + rand() * 0.5).toFixed(2);
    f.style.animationDuration = (6 + rand() * 8).toFixed(1) + 's';
    f.style.animationDelay = '-' + (rand() * 14).toFixed(1) + 's';
    snow.appendChild(f);
  }

  // ---- Elements ----
  var data = window.FLEECE_DATA;
  var form = document.getElementById('signin-form');
  var who = document.getElementById('who');
  var code = document.getElementById('code');
  var submit = document.getElementById('submit');
  var errorBox = document.getElementById('form-error');
  var errorText = document.getElementById('form-error-text');
  var signinScreen = document.getElementById('signin-screen');
  var letterScreen = document.getElementById('letter-screen');
  var envelope = document.getElementById('envelope');
  var letterName = document.getElementById('letter-name');
  var toggle = document.getElementById('toggle');

  function showError(message, field) {
    errorText.textContent = message;
    errorBox.hidden = false;
    code.setAttribute('aria-invalid', field === 'code' ? 'true' : 'false');
  }
  function clearError() {
    errorBox.hidden = true;
    code.removeAttribute('aria-invalid');
  }

  if (!data || !Array.isArray(data.people) || !data.people.length) {
    showError('The draw hasn’t been run yet. Check back once the organizer has set it up.');
    who.disabled = true; code.disabled = true; submit.disabled = true;
    return;
  }
  if (!window.crypto || !window.crypto.subtle) {
    showError('This browser can’t open the letter. Try a current version of Chrome, Safari, Firefox, or Edge.');
    submit.disabled = true;
  }

  data.people.forEach(function (p) {
    var o = document.createElement('option');
    o.value = p.name; o.textContent = p.name;
    who.appendChild(o);
  });

  // ---- Crypto (must match tools/draw.py) ----
  function normalizeCode(s) { return s.trim().toLowerCase().split(/\s+/).join(' '); }
  function b64d(s) {
    var bin = atob(s), out = new Uint8Array(bin.length);
    for (var j = 0; j < bin.length; j++) out[j] = bin.charCodeAt(j);
    return out;
  }
  function unlock(person, passcode) {
    var enc = new TextEncoder();
    return crypto.subtle.importKey('raw', enc.encode(normalizeCode(passcode)), 'PBKDF2', false, ['deriveKey'])
      .then(function (base) {
        return crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: b64d(person.salt), iterations: data.kdf.iterations, hash: 'SHA-256' },
          base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      })
      .then(function (key) {
        return crypto.subtle.decrypt(
          { name: 'AES-GCM', iv: b64d(person.iv), additionalData: enc.encode(person.name) },
          key, b64d(person.ct));
      })
      .then(function (buf) { return new TextDecoder().decode(buf); });
  }

  var match = '';
  var clearTimer = null;

  // ---- Sign in ----
  code.addEventListener('input', clearError);
  who.addEventListener('change', clearError);

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    clearError();
    var person = data.people.filter(function (p) { return p.name === who.value; })[0];
    if (!person) { showError('Pick your name first.'); who.focus(); return; }
    if (!code.value.trim()) { showError('Enter the passcode you were given.', 'code'); code.focus(); return; }

    submit.disabled = true;
    submit.textContent = 'Checking…';
    unlock(person, code.value).then(function (recipient) {
      match = recipient;
      letterName.textContent = '';
      code.value = '';
      signinScreen.hidden = true;
      letterScreen.hidden = false;
      envelope.classList.remove('is-open');
      toggle.textContent = 'Reveal your sheep';
      toggle.setAttribute('aria-expanded', 'false');
      window.scrollTo(0, 0);
      toggle.focus();
    }).catch(function () {
      showError('That passcode doesn’t open this letter. Please check the code you were given and try again.', 'code');
      code.focus();
      code.select();
    }).then(function () {
      submit.disabled = false;
      submit.textContent = 'Submit to the Flock';
    });
  });

  // ---- Break the seal / conceal ----
  toggle.addEventListener('click', function () {
    var open = !envelope.classList.contains('is-open');
    clearTimeout(clearTimer);
    if (open) {
      letterName.textContent = match;
    } else {
      clearTimer = setTimeout(function () { letterName.textContent = ''; }, 500);
    }
    envelope.classList.toggle('is-open', open);
    toggle.textContent = open ? 'Conceal your sheep' : 'Reveal your sheep';
    toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
})();
</script>
</body>
</html>
